<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CitySim 3D</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏙️</text></svg>" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b1226; }
      #boot { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(ellipse at 50% 40%, #1b2a4d, #0b1226 70%); color: #e8ecf2; font: 15px Segoe UI, system-ui, sans-serif; transition: opacity .45s; }
      #boot.done { opacity: 0; pointer-events: none; }
      .boot-city { display: flex; align-items: flex-end; gap: 5px; height: 64px; }
      .boot-city i { width: 12px; background: #4da3ff; border-radius: 2px 2px 0 0; animation: boot-grow 1.1s ease-in-out infinite; transform-origin: bottom; }
      .boot-city i:nth-child(1) { height: 28px; animation-delay: 0s }
      .boot-city i:nth-child(2) { height: 48px; animation-delay: .12s }
      .boot-city i:nth-child(3) { height: 64px; animation-delay: .24s }
      .boot-city i:nth-child(4) { height: 40px; animation-delay: .36s }
      .boot-city i:nth-child(5) { height: 54px; animation-delay: .48s }
      @keyframes boot-grow { 0%, 100% { transform: scaleY(.25); opacity: .5 } 50% { transform: scaleY(1); opacity: 1 } }
      #boot.failed .boot-city { display: none; }
      .boot-title { font-size: 24px; font-weight: 600; letter-spacing: .5px; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="ui"></div>
    <div id="boot"><div class="boot-title">CitySim 3D</div><div class="boot-city"><i></i><i></i><i></i><i></i><i></i></div><div class="boot-msg">Loading…</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
